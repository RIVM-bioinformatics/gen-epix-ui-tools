packages:
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  esbuild: true
  nx: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/node@26.1.0'
  - '@typescript-eslint/eslint-plugin@8.69.0'
  - '@typescript-eslint/parser@8.69.0'
  - '@typescript-eslint/project-service@8.69.0'
  - '@typescript-eslint/scope-manager@8.69.0'
  - '@typescript-eslint/tsconfig-utils@8.69.0'
  - '@typescript-eslint/type-utils@8.69.0'
  - '@typescript-eslint/types@8.69.0'
  - '@typescript-eslint/typescript-estree@8.69.0'
  - '@typescript-eslint/utils@8.69.0'
  - '@typescript-eslint/visitor-keys@8.69.0'
  - globals@17.12.0
  - '@eslint-react/ast@5.20.4'
  - '@eslint-react/core@5.20.4'
  - '@eslint-react/eslint-plugin@5.20.4'
  - '@eslint-react/eslint@5.20.4'
  - '@eslint-react/jsx@5.20.4'
  - '@eslint-react/kit@5.20.4'
  - '@eslint-react/shared@5.20.4'
  - '@eslint-react/var@5.20.4'
  - eslint-plugin-react-dom@5.20.4
  - eslint-plugin-react-jsx@5.20.4
  - eslint-plugin-react-naming-convention@5.20.4
  - eslint-plugin-react-rsc@5.20.4
  - eslint-plugin-react-web-api@5.20.4
  - eslint-plugin-react-x@5.20.4
