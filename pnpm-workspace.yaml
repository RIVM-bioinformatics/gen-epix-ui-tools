packages:
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  esbuild: true
  nx: true
  unrs-resolver: true

catalog:
  "@types/node": "26.1.0"
  "eslint": "10.6.0"
  "rimraf": "6.1.3"
  "rollup": "4.62.2"
  "rollup-plugin-dts": "6.4.1"
  "rollup-plugin-esbuild": "6.2.1"
  "typescript": "6.0.3"
  "vite-node": "6.0.0"

minimumReleaseAgeExclude:
  - '@types/node@26.1.0'
